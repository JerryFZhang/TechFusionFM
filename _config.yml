      # no subcategory: template emits a single <itunes:category>
      explicit: "false" # Apple now accepts only true / false
      language: zh-cn
      type: episodic # <itunes:type>

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://TechFusionFM.com
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false # /faq/ rather than /faq/index.html in permalinks and the sitemap
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: false
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Category & Tag
default_tags: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anatole
# theme: Daily

archive_generator:
  per_page: 0
  yearly: false
  monthly: false
  daily: false

robotstxt:
  useragent: "*"
  disallow:
  allow:
  sitemap: /sitemap.xml 

index_generator:
  per_page: 0
  order_by: -date
  include:
    - tag podcast # podcast only on the front page
#  exclude:
#    - tag Hexo # excluding hexp

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type:


