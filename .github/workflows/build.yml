name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Feed parity gate: published GUIDs / links / enclosure URLs must never
      # change, plus Apple / Podcast Index channel + item requirements.
      # xmllint ships on ubuntu-latest (libxml2-utils).
      - name: Check feeds
        run: npm run check:feeds
