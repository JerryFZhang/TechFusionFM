# Shared social / contact links, shown in every sidebar. Leave a value empty
# to hide it. Handles only (no URL), except email and wechat_qr.
social:
  email: hi@TechFusionFM.com
  x: TechFusionFM            # https://x.com/<handle>
  weibo: TechFusionFM        # https://weibo.com/<handle>
  instagram: TechFusionFM    # https://instagram.com/<handle>
  telegram: TechFusionFM     # https://t.me/<handle>
  bluesky:                   # https://bsky.app/profile/<handle>, e.g. techfusionfm.com
  bilibili:                  # numeric space id: https://space.bilibili.com/<id>
  wechat_qr:                 # image path under source/ or the theme, e.g. images/wechat-qr.png

